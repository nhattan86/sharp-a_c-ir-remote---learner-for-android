<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="remoteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="lcdGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a3b899" />
      <stop offset="100%" stop-color="#8fa385" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Infrared Wave Radiation Emitting from top -->
  <path d="M 216 68 A 44 44 0 0 1 296 68" stroke="#ef4444" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.6" />
  <path d="M 196 52 A 66 66 0 0 1 316 52" stroke="#f43f5e" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8" />
  <path d="M 176 36 A 88 88 0 0 1 336 36" stroke="#fb7185" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.9" />

  <!-- Remote Body -->
  <rect x="146" y="80" width="220" height="380" rx="36" fill="url(#remoteGrad)" filter="url(#shadow)" stroke="#94a3b8" stroke-width="3" />

  <!-- IR Emitter LED at top -->
  <rect x="236" y="72" width="40" height="12" rx="6" fill="#0f172a" />
  <circle cx="256" cy="78" r="4" fill="#ef4444" />

  <!-- LCD Screen -->
  <rect x="168" y="110" width="176" height="96" rx="10" fill="url(#lcdGrad)" stroke="#64748b" stroke-width="2" />
  <text x="216" y="168" font-family="monospace" font-size="44" font-weight="900" fill="#1e293b">24</text>
  <text x="268" y="150" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155">°C</text>
  <text x="178" y="132" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">COOL</text>
  <text x="286" y="132" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155">AUTO</text>

  <!-- Power Button (Red) -->
  <circle cx="304" cy="236" r="22" fill="#ef4444" stroke="#dc2626" stroke-width="2" />
  <path d="M 304 224 L 304 236 M 296 228 A 12 12 0 1 0 312 228" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- JET Button (Blue) -->
  <rect x="236" y="218" width="38" height="36" rx="8" fill="#3b82f6" />
  <text x="242" y="240" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">JET</text>

  <!-- Baby Button -->
  <rect x="170" y="218" width="38" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="189" cy="236" r="10" fill="#fbcfe8" />

  <!-- D-Pad Navigation & MODE button in center -->
  <circle cx="256" cy="320" r="48" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="256" cy="320" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <text x="240" y="324" font-family="sans-serif" font-size="9" font-weight="900" fill="#1e293b">MODE</text>

  <!-- Up & Down Arrows on D-Pad -->
  <path d="M 256 282 L 250 290 L 262 290 Z" fill="#475569" />
  <path d="M 256 358 L 250 350 L 262 350 Z" fill="#475569" />

  <!-- Brand Sharp -->
  <text x="256" y="420" font-family="sans-serif" font-size="14" font-weight="900" letter-spacing="4" fill="#1e293b" text-anchor="middle">SHARP</text>
  <text x="256" y="434" font-family="sans-serif" font-size="7" font-weight="bold" letter-spacing="1" fill="#64748b" text-anchor="middle">AIR CONDITIONER</text>
</svg>
